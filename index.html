<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اللبيب</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: home = chapters with lesson tiles; lesson = tabbed activity workspace. Dusk identity, single dark look. */
:root{
  --navy:#1B2A5A; --deep:#0F1838; --purple:#4B2A8A; --gold:#D9B25C; --cream:#F8F0DC;
  --card:#22346E; --card2:#2B3F82; --line:#3C509A; --muted:#B9C2E6;
  --good:#4CC38A; --bad:#FF8A8A; --ink:#F8F0DC; --bg:#0F1838;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);background-image:linear-gradient(180deg,#0F1838 0%,#1B2A5A 40%,#3A2A78 75%,#4B2A8A 100%);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;margin:0}
.wrap{max-width:1000px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 3rem}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:clamp(1.5rem,4.5vw,2rem);color:var(--gold)}
h3{font-size:1.2rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--deep)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(15,24,56,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:.8rem;padding:.6rem max(16px,env(safe-area-inset-right,0px)) .6rem max(16px,env(safe-area-inset-left,0px));flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.25rem;color:var(--gold);text-decoration:none;margin-right:auto}
.brand small{display:block;font-family:var(--f-body);font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.score{display:flex;align-items:center;gap:.5rem;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:.25rem .8rem;font-weight:800;font-variant-numeric:tabular-nums}
.score b{color:var(--gold)}
.meter{width:90px;height:8px;background:var(--deep);border-radius:9px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#F3D58C);transition:width .4s}
.btn{display:inline-block;background:var(--gold);color:var(--deep);border:0;font-weight:800;border-radius:12px;padding:.65rem 1.15rem;text-decoration:none;box-shadow:0 4px 0 #9c7d33}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #9c7d33}
.btn.ghost{background:transparent;color:var(--cream);border:2px solid var(--line);box-shadow:none}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1.2rem}
.eyebrow{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem;color:var(--gold)}
.hero{padding-block:2.6rem 1rem}
.hero h1{font-size:clamp(2.4rem,8vw,4.2rem);margin:.4rem 0 .8rem;color:var(--cream)}
.hero h1 span{color:var(--gold)}
.hero .lead{font-size:1.15rem;color:var(--muted);max-width:36rem}
.chap{padding-block:1.8rem 0}
.chap .eyebrow{margin-bottom:.2rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:.8rem;margin-top:1rem}
.tile{display:flex;flex-direction:column;gap:.4rem;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:.9rem 1rem;text-decoration:none;min-width:0}
.tile:hover{border-color:var(--gold);background:var(--card2)}
.tile .n{font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tile .t{font-weight:800;line-height:1.25;overflow-wrap:anywhere;flex:1}
.tile .m{display:flex;align-items:center;gap:.5rem;font-size:.85rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--gold)}
.tile .meter{flex:1;width:auto;height:6px}
.tile.full{border-color:var(--good)}
.crumb{padding-block:1.4rem .4rem}
.crumb h1{font-size:clamp(1.8rem,6vw,2.8rem);color:var(--cream);margin-top:.3rem;overflow-wrap:anywhere}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin:1rem 0}
.tab{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:.4rem .85rem;font-weight:800}
.tab[aria-selected="true"]{background:var(--gold);color:var(--deep);border-color:var(--gold)}
.tab em{font-style:normal;font-size:.8rem;opacity:.85;margin-left:.3rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:1.3rem}
.panel>h3{color:var(--gold);margin-bottom:.2rem}
.how{color:var(--muted);margin-bottom:1rem}
.q{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;padding:.6rem 0;border-bottom:1px dashed var(--line)}
.q:last-of-type{border-bottom:0}
.q .txt{flex:1 1 280px;min-width:0;overflow-wrap:anywhere}
input[type=text],textarea{font:inherit;background:var(--deep);color:var(--cream);border:2px solid var(--line);border-radius:10px;padding:.35rem .6rem;min-width:0}
input[type=text]{width:9rem;margin-inline:.25rem}
textarea{width:100%;min-height:6rem;resize:vertical}
.ok{border-color:var(--good)!important}.no{border-color:var(--bad)!important}
.fb{font-size:.92rem;min-height:1.3em;flex-basis:100%}
.fb.ok{color:var(--good)}.fb.no{color:var(--bad)}
.tf{display:flex;gap:.4rem}
.tf button,.opt{background:var(--deep);border:2px solid var(--line);border-radius:10px;padding:.35rem .9rem;font-weight:800}
.tf button:hover,.opt:hover{border-color:var(--gold)}
.tf button.right,.opt.right{background:var(--good);border-color:var(--good);color:var(--deep)}
.tf button.wrong,.opt.wrong{background:var(--bad);border-color:var(--bad);color:var(--deep)}
.tf button:disabled{cursor:default}
.match{display:grid;grid-template-columns:1fr 1fr;gap:.6rem 1.2rem}
.match .col{display:grid;gap:.6rem;align-content:start}
.opt{text-align:left;width:100%;overflow-wrap:anywhere}
.opt.sel{border-color:var(--gold);background:var(--card2)}
.opt.done{background:var(--good);border-color:var(--good);color:var(--deep);cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .3s}
.ws{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;max-width:430px;margin:0 auto 1rem}
.ws button{aspect-ratio:1;background:var(--deep);border:0;border-radius:7px;font-weight:800;font-size:clamp(.85rem,3.6vw,1.1rem);padding:0;color:var(--cream)}
.ws button.s{background:var(--gold);color:var(--deep)}
.ws button.f{background:var(--good);color:var(--deep)}
.words{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
.words span{border:1px solid var(--line);border-radius:99px;padding:.15rem .8rem;font-weight:800}
.words span.f{background:var(--good);border-color:var(--good);color:var(--deep);text-decoration:line-through}
.done-msg{margin-top:1rem;padding:.7rem 1rem;border-radius:12px;background:var(--good);color:var(--deep);font-weight:800}
.prompt{background:var(--deep);border-radius:14px;padding:.9rem 1.1rem;margin-bottom:1rem}
.prompt b{display:block;color:var(--gold);font-family:var(--f-display);font-size:1.1rem;margin-bottom:.2rem}
.chk{display:flex;gap:.7rem;align-items:flex-start;padding:.55rem 0;border-bottom:1px dashed var(--line)}
.chk input{width:1.3rem;height:1.3rem;margin-top:.2rem;accent-color:var(--gold);flex:none}
.chk label{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:1rem}
.card{background:var(--deep);border:1px solid var(--line);border-radius:16px;padding:1rem 1.1rem;min-width:0}
.card h3{color:var(--gold);margin-bottom:.5rem}
.card dl{margin:0;display:grid;gap:.5rem}
.card dt{font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card dd{margin:0;font-weight:700}
.did{margin-top:1rem;background:var(--purple);border-radius:16px;padding:1rem 1.2rem}
.did b{font-family:var(--f-display);font-size:1.2rem;color:var(--gold);margin-right:.5rem}
.chain{display:flex;gap:1.1rem;overflow-x:auto;padding:.6rem .1rem 1rem}
.chain span{flex:none;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:.4rem .8rem;font-weight:700;position:relative}
.chain span:first-child{background:var(--gold);color:var(--deep)}
.chain span+span::before{content:"\2190";position:absolute;left:-.8rem;top:50%;transform:translateY(-50%);color:var(--gold);font-size:.8rem}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem;margin-bottom:1rem}
.slot{min-height:3.2rem;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;padding:.3rem;text-align:center;font-weight:800;color:var(--muted)}
.slot.f{border:2px solid var(--good);background:var(--good);color:var(--deep)}
.pool{display:flex;gap:.6rem;flex-wrap:wrap}
.pool .opt{width:auto}
.idgrid{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;align-items:start}
.form{display:grid;gap:.6rem}
.form label{display:grid;gap:.15rem;font-weight:700;font-size:.9rem;color:var(--muted)}
.form input{width:100%;margin:0}
.idcard{background:var(--cream);color:var(--navy);border-radius:18px;padding:1rem 1.1rem;border-top:10px solid var(--gold)}
.idcard h4{font-family:var(--f-display);margin:0 0 .5rem;font-size:1.2rem;color:var(--purple)}
.idcard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.2rem .8rem}
.idcard dt{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;opacity:.7}
.idcard dd{margin:0;font-weight:800;min-height:1.4em;overflow-wrap:anywhere}
.pager{display:flex;justify-content:space-between;gap:.7rem;flex-wrap:wrap;margin-top:1.6rem}
footer{margin-top:2.4rem;color:var(--muted);text-align:center;font-size:.9rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.chip{display:inline-flex;align-items:center;background:var(--gold);color:var(--deep);border:0;border-radius:14px;padding:.55rem 1rem;font-weight:800;font-size:1.05rem;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 3px 0 #9c7d33;max-width:100%;overflow-wrap:anywhere}
.chip.sel{outline:3px solid var(--cream);transform:translateY(-2px)}
.chip.lift{opacity:.35}
.chip.used{display:none}
.dragghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) scale(1.08);box-shadow:0 12px 28px #000a}
.tray{position:sticky;top:calc(env(safe-area-inset-top,0px) + 4.2rem);z-index:5;background:var(--card2);border:2px dashed var(--gold);border-radius:16px;padding:.7rem;display:flex;gap:.55rem;flex-wrap:wrap;justify-content:center;margin-bottom:1rem;max-height:34vh;overflow:auto}
.tray:empty::after{content:"All words placed!";color:var(--good);font-weight:800}
.dz{display:inline-flex;align-items:center;justify-content:center;min-width:7.5rem;min-height:2.6rem;border:2px dashed var(--gold);border-radius:12px;padding:.1rem .6rem;margin-inline:.25rem;vertical-align:middle;background:var(--deep);font-weight:800;color:var(--gold);cursor:pointer}
.dz.over{background:var(--card2);border-style:solid;transform:scale(1.05)}
.dz.filled{border:2px solid var(--good);background:var(--good);color:var(--deep);cursor:default}
.dz.empty::before{content:"?";opacity:.6}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;align-items:center;padding:.4rem 0;border-bottom:1px dashed var(--line)}
.mrow .dz{display:flex;width:100%;margin:0}
.mrow b{overflow-wrap:anywhere}
.illus{display:inline-flex;flex:none;filter:drop-shadow(0 6px 14px #0008)}
.crumb .ttl{display:flex;gap:1rem;align-items:center}
.tile .top{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem}
.ws{touch-action:none}
.ws button.p{background:var(--gold);color:var(--deep)}
.big-tf button{padding:.7rem 1.4rem;font-size:1.1rem}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .45s}
.idrow{display:grid;grid-template-columns:auto 1fr;gap:.4rem .8rem;align-items:center}
.idrow dt{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.idcard .dz{background:#fff;color:#1B2A5A;border-color:#4B2A8A;min-width:0;width:100%;justify-content:flex-start;margin:0}
.idcard .dz.filled{background:#4CC38A}

.opts{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));margin-top:.5rem;width:100%}
.opts .opt{text-align:center;font-size:1.05rem;padding:.7rem .8rem}
.qq{padding:.8rem 0;border-bottom:1px dashed var(--line)}
.qq:last-of-type{border-bottom:0}
.qq .txt{font-weight:700;font-size:1.1rem;overflow-wrap:anywhere}
.mem{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:.6rem}
.card3{perspective:700px;min-height:96px}
.card3 button{width:100%;height:100%;min-height:96px;border:2px solid var(--line);border-radius:14px;background:var(--deep);color:var(--cream);font-weight:800;font-size:.95rem;padding:.4rem;display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere}
.card3 button.back{background:linear-gradient(135deg,#4B2A8A,#22346E);color:var(--gold);font-size:2rem}
.card3 button.up{background:var(--gold);color:var(--deep);border-color:var(--gold)}
.card3 button.ok{background:var(--good);border-color:var(--good);color:var(--deep)}
.sorts{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:.4rem}
.sortbox{display:block!important;min-height:140px;width:100%;margin:0!important;padding:.6rem!important;text-align:left;justify-content:flex-start;align-items:flex-start;background:var(--deep)!important;border-radius:16px!important}
.sortbox b{display:block;font-size:1.05rem;margin-bottom:.4rem;color:var(--cream)}
.sortbox.t b{color:var(--good)}.sortbox.f b{color:var(--bad)}
.placed{display:block;background:var(--good);color:var(--deep);border-radius:10px;padding:.35rem .6rem;margin-top:.35rem;font-weight:700;font-size:.9rem;overflow-wrap:anywhere}
.banner{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:20px;margin:.9rem 0 0;display:block;box-shadow:0 14px 40px #0008;max-height:360px}
@media(max-width:700px){.sorts{grid-template-columns:1fr}}
@media(max-width:700px){.idgrid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- drag engine (pointer drag with tap fallback) ---------- */
function dnd(root,check){
  var sel=null;
  function clear(){if(sel){sel.classList.remove("sel");sel=null;}}
  function dzAt(x,y){var e=document.elementFromPoint(x,y);return e&&e.closest?e.closest(".dz"):null;}
  function drop(chip,dz){if(!dz||dz.classList.contains("filled"))return;if(!check(chip,dz)){shake(chip);shake(dz);}}
  function offs(){root.querySelectorAll(".dz.over").forEach(function(x){x.classList.remove("over");});}
  root.addEventListener("pointerdown",function(e){
    var chip=e.target.closest(".chip");if(!chip||chip.classList.contains("used"))return;
    var sx=e.clientX,sy=e.clientY,ghost=null,moved=false;
    function mv(ev){
      if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)<8)return;
      if(!moved){moved=true;ghost=chip.cloneNode(true);ghost.className="chip dragghost";document.body.appendChild(ghost);chip.classList.add("lift");}
      ghost.style.left=ev.clientX+"px";ghost.style.top=ev.clientY+"px";offs();var d=dzAt(ev.clientX,ev.clientY);if(d&&!d.classList.contains("filled"))d.classList.add("over");}
    function up(ev){
      document.removeEventListener("pointermove",mv);document.removeEventListener("pointerup",up);document.removeEventListener("pointercancel",up);
      if(ghost)ghost.remove();chip.classList.remove("lift");offs();
      if(moved){clear();if(ev.type==="pointerup")drop(chip,dzAt(ev.clientX,ev.clientY));}
      else{if(sel===chip)clear();else{clear();sel=chip;chip.classList.add("sel");}}
    }
    document.addEventListener("pointermove",mv);document.addEventListener("pointerup",up);document.addEventListener("pointercancel",up);
  });
  root.addEventListener("click",function(e){var dz=e.target.closest(".dz");if(dz&&sel){var c=sel;clear();drop(c,dz);}});
  root.addEventListener("keydown",function(e){if(e.key!=="Enter"&&e.key!==" ")return;var t=e.target;
    if(t.classList.contains("chip")){e.preventDefault();clear();sel=t;t.classList.add("sel");}
    else if(t.classList.contains("dz")&&sel){e.preventDefault();var c=sel;clear();drop(c,t);}});
}

  if(!POOL){POOL=[];D.lessons.forEach(function(x){x.g.forEach(function(g){var a=g[1].split(/\s*,\s*/);a.forEach(function(w){w=w.split(/\s*\/\s*/)[0];if(w&&w.length<=11&&POOL.indexOf(w)<0)POOL.push(w);});});});}
  var hv={};have.forEach(function(h){hv[norm(h)]=1;});
  return shuffle(POOL.filter(function(w){return !hv[norm(w)];}),seed).slice(0,n);
}

/* normalise */
var NUM={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90,hundred:100};
function norm(s){return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/^the/,"").replace(/[^a-z0-9]/g,"");}
function same(u,a){var nu=norm(u),na=norm(a);if(!nu)return false;if(nu===na)return true;
  if(NUM[na]!==undefined&&String(NUM[na])===nu)return true;if(NUM[nu]!==undefined&&String(NUM[nu])===na)return true;return false;}
function okAny(u,a){return a.split(/\s*\/\s*|\s+or\s+/).some(function(o){return same(u,o);});}

/* gaps */
function pGaps(p,l,x,rec){
  head(p,"Drag the words","Drag each word to its place. You can also tap a word, then tap the blank.");
  var tray=el("div","tray");p.appendChild(tray);var root=el("div");p.appendChild(root);
  var chips=[],total=0,got=0;
  l.g.forEach(function(g){
    var parts=g[0].split("……"),nb=parts.length-1,ans=nb>1?g[1].split(/\s*,\s*/):[g[1]];
    var q=el("div","q"),t=el("div","txt");q.appendChild(t);
    parts.forEach(function(s,k){t.appendChild(document.createTextNode(s));
      if(k<nb){var a=ans[Math.min(k,ans.length-1)];var dz=mkDz();dz.dataset.a=a;t.appendChild(dz);chips.push(a.split(/\s*\/\s*/)[0]);total++;}});
    root.appendChild(q);
  });
  var all=chips.concat(distractors(l,chips,3,l.n*13+l.c));
  shuffle(all,l.n*5+l.c*3).forEach(function(w){tray.appendChild(mkChip(w));});
  dnd(p,function(chip,dz){if(!okAny(chip.textContent,dz.dataset.a))return false;settle(chip,dz);got++;rec("g",got);if(got==total)win(p,"All words are in the right place. Well done!");return true;});
}

/* quick quiz */
function quizItems(l){
  var out=[];l.g.forEach(function(g){var parts=g[0].split("……");if(parts.length===2)out.push({pre:parts[0],post:parts[1],a:g[1].split(/\s*\/\s*/)[0]});});
  return out.slice(0,8);
}
function pQuiz(p,l,x,rec){
  head(p,"Quick quiz","Tap the right word for each sentence.");
  var items=quizItems(l),got=0,done=0,all=items.map(function(i){return i.a;});
  items.forEach(function(it,qi){
    var others=shuffle(all.filter(function(a){return norm(a)!==norm(it.a);}),l.n*3+qi+l.c);
    if(others.length<2)others=others.concat(distractors(l,all,3,qi+7));
    var seen={},opts=[it.a];others.forEach(function(o){if(opts.length<3&&!seen[norm(o)]&&norm(o)!==norm(it.a)){seen[norm(o)]=1;opts.push(o);}});
    opts=shuffle(opts,qi*11+l.n+5);
    var q=el("div","qq"),t=el("div","txt");t.appendChild(document.createTextNode(it.pre+" ____ "+it.post));q.appendChild(t);
    var row=el("div","opts");
    opts.forEach(function(o,oi){var b=el("button","opt",o);b.type="button";b.id="q"+qi+"-"+oi;
      b.onclick=function(){var ok=norm(o)===norm(it.a);row.querySelectorAll("button").forEach(function(y){y.disabled=true;if(norm(y.textContent)===norm(it.a))y.classList.add("right");});
        if(!ok)b.classList.add("wrong");done++;if(ok)got++;rec("q",got);if(done===items.length)win(p,"You got "+got+" out of "+items.length+"!");};
      row.appendChild(b);});
    q.appendChild(row);p.appendChild(q);});
}

/* word search */
function pWS(p,l,x,rec){
  head(p,"Word search","Swipe your finger from the first letter to the last letter of a word. Words go across, down, or diagonally down.");
  var g=l.ws_g,grid=el("div","ws"),cells=[];
  for(var r=0;r<10;r++)for(var c=0;c<10;c++){var b=el("button","",g[r][c]);b.type="button";b.id="ws"+r+"-"+c;b.dataset.r=r;b.dataset.c=c;b.setAttribute("aria-label","Letter "+g[r][c]);cells.push(b);grid.appendChild(b);}
  p.appendChild(grid);
  var wl=el("div","words"),tags={};l.words.forEach(function(w){var t=el("span","",w);tags[w]=t;wl.appendChild(t);});p.appendChild(wl);
  var found={},cnt=0,start=null,prev=[],first=null;
  function cellAt(x,y){var e=document.elementFromPoint(x,y);return e&&e.closest?e.closest(".ws button"):null;}
  function line(a,b){var dr=b[0]-a[0],dc=b[1]-a[1];if(!(dr===0||dc===0||Math.abs(dr)===Math.abs(dc)))return null;var n=Math.max(Math.abs(dr),Math.abs(dc))+1,sr=Math.sign(dr),sc=Math.sign(dc),o=[];for(var i=0;i<n;i++)o.push([a[0]+sr*i,a[1]+sc*i]);return o;}
  function mark(list,cls){list.forEach(function(q){cells[q[0]*10+q[1]].classList.add(cls);});}
  function unmark(){prev.forEach(function(q){cells[q[0]*10+q[1]].classList.remove("p");});prev=[];}
  function finish(list){
    var s=list.map(function(q){return g[q[0]][q[1]];}).join(""),rv=s.split("").reverse().join(""),hit=false;
    l.words.forEach(function(w){if((w===s||w===rv)&&!found[w]){found[w]=1;hit=true;cnt++;mark(list,"f");tags[w].classList.add("f","pop");rec("w",cnt);if(cnt==l.words.length)win(p,"You found all the words!");}});
    return hit;}
  grid.addEventListener("pointerdown",function(e){var c=cellAt(e.clientX,e.clientY);if(!c)return;e.preventDefault();
    var a=[+c.dataset.r,+c.dataset.c],moved=false;
    if(first&&!(first[0]===a[0]&&first[1]===a[1])){var L=line(first,a);cells[first[0]*10+first[1]].classList.remove("s");var f=first;first=null;if(L&&L.length>1){finish(L);return;}}
    start=a;
    function mv(ev){var d=cellAt(ev.clientX,ev.clientY);if(!d)return;var b=[+d.dataset.r,+d.dataset.c];var L=line(start,b);if(!L)return;if(L.length>1)moved=true;unmark();prev=L;mark(L,"p");}
    function up(ev){document.removeEventListener("pointermove",mv);document.removeEventListener("pointerup",up);document.removeEventListener("pointercancel",up);
      var L=prev.slice();unmark();
      if(moved&&L.length>1){finish(L);}
      else{if(first&&first[0]===a[0]&&first[1]===a[1]){cells[a[0]*10+a[1]].classList.remove("s");first=null;}else{first=a;cells[a[0]*10+a[1]].classList.add("s");}}
      start=null;}
    document.addEventListener("pointermove",mv);document.addEventListener("pointerup",up);document.addEventListener("pointercancel",up);
  });
}

      if(!c.exists){er.textContent="This code is not valid. Check it and try again.";return;}
      var cd=c.data();
      if(cd.claimedBy===uid){return cloud.collection("users").doc(uid).set({code:id},{merge:true}).then(enter);}
      if(cd.claimedBy){er.textContent="This code is already used on another device. Contact the author.";return;}
      return ref.update({claimedBy:uid,claimedAt:new Date().toISOString()}).then(function(){return cloud.collection("users").doc(uid).set({code:id},{merge:true});}).then(enter)
        .catch(function(){er.textContent="This code is already used on another device. Contact the author.";});
    }).catch(function(){er.textContent="Could not check the code. Check your internet and try again.";});
  };
}
function boot(){
  var C=window.ALLABIB_FIREBASE;if(!C){route();return;}
  var B="https://www.gstatic.com/firebasejs/10.12.2/";
  loadJs(B+"firebase-app-compat.js",function(){loadJs(B+"firebase-auth-compat.js",function(){loadJs(B+"firebase-firestore-compat.js",function(){
    firebase.initializeApp(C);cloud=firebase.firestore();
    firebase.auth().onAuthStateChanged(function(u){
      if(!u){firebase.auth().signInAnonymously().catch(function(){codeView("Could not connect. Check your internet and reload.",true);});return;}
      uid=u.uid;
      try{var r=localStorage.getItem(KEY+"-"+uid);PR=r?JSON.parse(r)||{}:{};}catch(e){PR={};}
      cloud.collection("users").doc(uid).get().then(function(d){
        var code=d.exists&&d.data().code;if(!code){codeView();return;}
        return cloud.collection("codes").doc(code).get().then(function(c){
          if(c.exists&&c.data().claimedBy===uid){merge((d.data()||{}).progress);route();}else codeView();});
      }).catch(function(){codeView("Could not connect. Check your internet and reload.",true);});
    });
  });});});
}
boot();
})();
</script>
